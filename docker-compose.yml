services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  embedding:
    build: ./embedding-service
    ports: ["8000:8000"]

volumes:
  sqldata:
  qdrantdata:
